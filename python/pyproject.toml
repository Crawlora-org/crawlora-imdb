[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crawlora-imdb"
version = "0.2.0"
description = "Crawlora IMDb API client with 30 endpoints for title and name search, charts, ratings, credits, awards, episodes, reviews, images, and title metadata"
readme = "README.md"
keywords = ["crawlora", "api-client", "sdk", "web-scraping", "scraping-api", "imdb", "imdb-api", "imdb-scraper", "imdb-data", "imdb-title-name-search", "imdb-charts", "imdb-ratings", "imdb-credits", "imdb-awards", "imdb-episodes", "imdb-reviews", "imdb-images", "imdb-title-metadata"]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Crawlora" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Typing :: Typed",
]
dependencies = ["typing-extensions>=4.7; python_version < '3.11'"]

[project.optional-dependencies]
async = ["httpx>=0.27"]
test = ["mypy>=1.11", "pytest>=8"]

[project.urls]
Homepage = "https://crawlora.net/?utm_source=pypi&utm_medium=referral&utm_campaign=platform-clients&utm_content=imdb-python-homepage"
Documentation = "https://crawlora.net/docs?utm_source=pypi&utm_medium=referral&utm_campaign=platform-clients&utm_content=imdb-python-api-docs"
Repository = "https://github.com/Crawlora-org/crawlora-imdb"

[tool.setuptools.packages.find]
where = ["."]
include = ["crawlora_imdb"]

[tool.setuptools.package-data]
"crawlora_imdb" = ["py.typed", "*.pyi"]
